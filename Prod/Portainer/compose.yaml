# docker run -p <HostPort:containerport> imagename:tag

# Start containers:: 
#   docker compose up --detach

services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.39.5
    restart: unless-stopped
    networks: 
      - portainer_net
    environment:
      AGENT_SECRET: ${AGENT_SECRET}
    ports:
      - "${portainer_port_ui}:9443"
    volumes:
      - '${portainer_data}:/data'
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  portainer_net:
    driver: bridge