---
# ===========================================================================================
# Title   FreshRSS
# Created By: PJ Guibord
# Date 01/18/2025
# Revision: 08/22/2026
# Version: 1.1
# ===========================================================================================
# Revision History:
#   - 1.0: Initial Release
#   - 1.1: Pinned image. Removed env_file duplication and the PUID/PGID
#          variables -- the upstream FreshRSS image ignores them and runs Apache as its
#          built-in www-data (uid 33). Data on NFS is owned 988:33; access works via the
#          GROUP bit, so gid 33 must keep matching or FreshRSS loses write access.
# ===========================================================================================

# Start containers::
#   docker compose up --detach

services:
  freshrss:
    container_name: freshrss
    image: ${freshrss_image}
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    ports:
      - '${freshrss_port}:80'
    networks:
      - freshrss_net
    environment:
      TZ: ${time_zone}
      CRON_MIN: '13,43'
      SERVER_DNS: ${server_dns}
    volumes:
      - '${freshrss_config}:/var/www/FreshRSS/data'

networks:
  freshrss_net:
    name: freshrss_net
    driver: bridge