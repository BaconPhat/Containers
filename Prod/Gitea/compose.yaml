# docker run -p <HostPort:containerport> imagename:tag

# Start containers:: 
#   docker compose up --detach


services:

  gitea-db:
    image: ${DB_IMAGE}
    container_name: gitea_db
    restart: unless-stopped
    networks:
      - gitea_net
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${GITEA_DB_NAME}
      POSTGRES_USER: ${GITEA_DB_USER}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8 --data-checksums"
    volumes:
      - ${GITEA_DB_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - diun.include_tags=^17\.\d+$

  gitea:
    image: ${GITEA_IMAGE}
    container_name: gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    ports:
      - "${GITEA_SSH_PORT}:22"
    networks:
      - gitea_net
      - proxy_net
    environment:
      TZ: ${TZ}
      USER_UID: "1000"
      USER_GID: "1000"
      # --- picture ---
      GITEA__picture__ENABLE_FEDERATED_AVATAR: "false"
      GITEA__picture__DISABLE_GRAVATAR: "true"
      # --- database ---
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME}
      GITEA__database__USER: ${GITEA_DB_USER}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      # --- server ---
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}/
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__LANDING_PAGE: explore
      GITEA__service__DISABLE_ORGANIZATIONS_PAGE: "true"
      # --- security ---
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES: ${GITEA_REVERSE_PROXY_TRUSTED_PROXIES}
      # --- access ---
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__service__DEFAULT_PRIVATE: private
      GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      GITEA__service__DISABLE_USERS_PAGE: "true"
      # --- other ---
      GITEA__other__SHOW_FOOTER_VERSION: "false"
    volumes:
      - ${GITEA_DATA_PATH}:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  gitea_net:
    name: gitea_net
  proxy_net:
    external: true