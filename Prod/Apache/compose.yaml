x-site: &site
  image: ${image}
  restart: unless-stopped
  networks:
    - apache_net
  environment:
    TZ: America/Denver
  healthcheck:
    test:
      - CMD
      - bash
      - -c
      - >-
        exec 3<>/dev/tcp/127.0.0.1/80 &&
        printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
        head -n1 <&3 | grep -q ' 200 '
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  website0:
    <<: *site
    container_name: ${container_name0}
    ports:
      - '${apache_site0_port}:80'
    volumes:
      - '${apache_site0_html}:/usr/local/apache2/htdocs/:ro'

  website1:
    <<: *site
    container_name: ${container_name1}
    ports:
      - '${apache_site1_port}:80'
    volumes:
      - '${apache_site1_html}:/usr/local/apache2/htdocs/:ro'

  website2:
    <<: *site
    container_name: ${container_name2}
    ports:
      - '${apache_site2_port}:80'
    volumes:
      - '${apache_site2_html}:/usr/local/apache2/htdocs/:ro'

  website3:
    <<: *site
    container_name: ${container_name3}
    ports:
      - '${apache_site3_port}:80'
    volumes:
      - '${apache_site3_html}:/usr/local/apache2/htdocs/:ro'

networks:
  apache_net:
    name: apache_net
    driver: bridge