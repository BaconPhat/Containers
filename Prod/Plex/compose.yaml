# Start containers:
#   docker compose up --detach

services:
  plex:
    container_name: plex
    image: ${Plex_Image}
    restart: unless-stopped
    networks: 
      - plex_net
    env_file:
      - .env
    ports:
      - "32400:32400/tcp"    # bridge mode; no GDM/DLNA needed
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${time_zone}
      PLEX_CLAIM: ${Plex_Claim}
      HOSTNAME: ${Plex_Hostname}
      VERSION: docker
      ADVERTISE_IP: ${Plex_Advertise}
      ALLOWED_NETWORKS: ${Plex_Allowed_Nets}
    volumes:
      - '${Plex_Config}:/config'
      - '${Plex_Transcode}:/transcode'  # /dev/shm - transcode in RAM
      - '${Plex_Media}:/media'

networks:
  plex_net:
    name: plex_net
    driver: bridge
