# docker run -p <HostPort:containerport> imagename:tag

# Start containers:: 
#   docker compose up --detach

services:

  vaultwarden-db:
    container_name: vaultwarden_db
    image: ${db_image}
    restart: unless-stopped
    networks:
      - vaultwarden_net
    environment:
      POSTGRES_USER: ${vaultwarden_db_un}
      POSTGRES_PASSWORD: ${vaultwarden_db_pw}
      POSTGRES_DB: ${vaultwarden_db}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      TZ: ${time_zone}
    volumes:
      - '${vaultwarden_db_data}:/var/lib/postgresql/data'
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${vaultwarden_db_un} -d ${vaultwarden_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  vaultwarden:
    container_name: ${container_name}
    image: ${image}
    restart: unless-stopped
    networks:
      - vaultwarden_net
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    ports:
      - '${vaultwarden_port}:80'
    environment:
      PUID: ${vaultwarden_pid}
      PGID: ${vaultwarden_gid}
      TZ: ${time_zone}
      DOMAIN: ${vaultwarden_url}
      PUSH_ENABLED: true
      PUSH_INSTALLATION_ID: ${installation_id}
      PUSH_INSTALLATION_KEY: ${installation_key}
      ENABLE_WEBSOCKET: false
      ADMIN_TOKEN: ${admin_token}
      ADMIN_RATELIMIT_MAX_BURST: 10
      ADMIN_RATELIMIT_SECONDS: 60
      SENDS_ALLOWED: true
      LOGIN_RATELIMIT_MAX_BURST: 10
      LOGIN_RATELIMIT_SECONDS: 60
      INCOMPLETE_2FA_TIME_LIMIT: 3
      SIGNUPS_ALLOWED: true
      SIGNUPS_VERIFY: true
      SIGNUPS_VERIFY_RESEND_TIME: 3600
      SIGNUPS_VERIFY_RESEND_LIMIT: 5
      INVITATION_EXPIRATION_HOURS: 1
      EMERGENCY_ACCESS_ALLOWED: true
      WEB_VAULT_ENABLED: true

      # =====================================
      # Postgres Config
      DATABASE_URL: 'postgresql://${vaultwarden_db_un}:${vaultwarden_db_pw}@${vaultwarden_db_server}:${vaultwarden_db_port}/${vaultwarden_db}'
      DATABASE_MIN_CONNS: 1
      DATABASE_MAX_CONNS: 5
      # =====================================
      # Email Configuration
      SMTP_HOST: ${smtp_host}
      SMTP_PORT: ${smtp_port}
      SMTP_FROM: ${smtp_sender_name}
      SMTP_FROM_EMAIL: ${smtp_sender_email} 
      SMTP_USERNAME: ${smtp_un}
      SMTP_PASSWORD: ${smtp_pw}
      SMTP_SECURITY: starttls
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - '${vaultwarden_config}:/data/'

networks:
  vaultwarden_net:
    name: vaultwarden_net
    driver: bridge